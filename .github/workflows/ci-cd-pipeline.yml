name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-build:
    name: Build & Verify Spring Boot Reactor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Compile & Test Java Microservices
        run: mvn test-compile -B

  frontend-build:
    name: Build & Verify Vite React Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

  python-ai-test:
    name: Verify Python Flask AI Microservice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install & Test AI Engine
        run: |
          cd python-ai-service
          pip install -r requirements.txt
          python -c "import app; print('AI Engine Initialized Cleanly')"
