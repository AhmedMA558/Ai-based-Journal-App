# Template only - do NOT fill in real values here, this file IS committed.
#
# Preferred: create the real secret imperatively, without ever writing it to
# disk:
#   kubectl create secret generic app-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 64)" \
#     --from-literal=TOTP_ENCRYPTION_KEY="$(openssl rand -base64 64)" \
#     --from-literal=MYSQL_ROOT_PASSWORD="<a-real-password>"
#
# Alternative: copy this file to k8s/02-secret.yaml (already gitignored),
# fill in real values, then `kubectl apply -f k8s/02-secret.yaml`.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME"
  TOTP_ENCRYPTION_KEY: "REPLACE_ME"
  MYSQL_ROOT_PASSWORD: "REPLACE_ME"
