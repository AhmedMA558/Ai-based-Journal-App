apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-ai-service
  labels:
    app: python-ai-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-ai-service
  template:
    metadata:
      labels:
        app: python-ai-service
    spec:
      containers:
      - name: python-ai-service
        image: ahmedma558/ai-journal-python-ai:latest
        ports:
        - containerPort: 5000
        env:
        - name: PORT
          value: "5000"
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: python-ai-service
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
  selector:
    app: python-ai-service
