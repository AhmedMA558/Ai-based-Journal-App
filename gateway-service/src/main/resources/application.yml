server:
  port: 8080

spring:
  application:
    name: gateway-service
  # WebFlux's own default is 256KB - well under a real profile-photo upload
  # (file-service already allows up to 50MB). Without this, a multipart body
  # proxied through the reactive gateway can be truncated mid-stream once it
  # exceeds the default buffer, and the receiving service's multipart parser
  # then fails with a confusing "Current request is not a multipart request"
  # rather than a clean size-limit error - found live while reproducing a
  # broken avatar upload.
  codec:
    max-in-memory-size: 20MB
  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: ${SPRING_REDIS_PORT:6379}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
              - "http://127.0.0.1:3000"
              # Real production domain - this list predates the app having
              # one at all, and Spring Cloud Gateway's CORS filter rejects
              # (403, before any route matching) any request whose Origin
              # header isn't explicitly listed here. Every browser sends
              # Origin on every fetch/XHR call, same-origin or not - so this
              # silently 403'd every real browser user while curl (which
              # sends no Origin header by default) worked fine, masking it.
              - "https://mindorajournal.com"
              - "https://www.mindorajournal.com"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        # Split from the general auth-service route below so the five
        # unauthenticated, brute-forceable/probeable endpoints get a real
        # rate limit while everything else under /api/v1/auth/** (e.g. /me,
        # /password, /mfa/status) stays unthrottled. order: -1 guarantees
        # this route is matched first for these paths regardless of
        # declaration-order edge cases in Spring Cloud Gateway's route
        # locator. register is included here too - unlimited-speed calls
        # let an attacker probe usernames/emails against real accounts.
        - id: auth-service-sensitive
          uri: http://auth-service:8081
          order: -1
          predicates:
            - Path=/api/v1/auth/login,/api/v1/auth/register,/api/v1/auth/mfa/verify,/api/v1/auth/password/forgot,/api/v1/auth/password/reset
          filters:
            - name: JwtAuthenticationFilter
            - name: RequestRateLimiter
              args:
                # Widened from the original 5/1 after a real production
                # incident: this endpoint is keyed by client IP, and NAT'd
                # networks (a household, an office, a mobile carrier) put
                # many genuine users behind one IP - 5 immediate attempts
                # was tight enough that ordinary interactive use (a few
                # retries, a shared connection) could trip it and lock out
                # everyone on that IP, not just an attacker. 20 immediate
                # attempts, throttling to 3/sec (180/min) sustained, still
                # meaningfully blocks real brute-force automation while
                # giving legitimate shared-IP traffic real headroom.
                redis-rate-limiter.replenishRate: 3
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@ipKeyResolver}"

        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: JwtAuthenticationFilter

        - id: user-service
          uri: http://user-service:8082
          predicates:
            - Path=/api/v1/users/**
          filters:
            - name: JwtAuthenticationFilter

        # journal/ai/search all get a real per-user rate limit below, on top of
        # the always-present JwtAuthenticationFilter - unlike the pre-auth
        # auth-service-sensitive route, these are the endpoints where a single
        # authenticated account scripting requests (flooding journal creates,
        # hammering AI chat, or firing search-as-you-type without debounce)
        # could still load up the single-VPS deployment even though individual
        # journal payloads are now size-capped. userKeyResolver keys by the
        # gateway's own validated X-User-Id, not by IP, so one heavy user
        # never throttles everyone else sharing their network.
        - id: journal-service
          uri: http://journal-service:8083
          predicates:
            - Path=/api/v1/journals/**
          filters:
            - name: JwtAuthenticationFilter
            - name: RequestRateLimiter
              args:
                # A real human writes/edits entries far slower than this -
                # generous enough for rapid list/pagination/toggle clicks,
                # tight enough to block a create-flood script.
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 30
                key-resolver: "#{@userKeyResolver}"

        - id: ai-service
          uri: http://ai-service:8084
          predicates:
            - Path=/api/v1/ai/**
          filters:
            - name: JwtAuthenticationFilter
            - name: RequestRateLimiter
              args:
                # Tighter than journal/search - each call proxies through to
                # python-ai-service (and, if HUGGINGFACE_API_KEY is ever set,
                # a real external HF API call with real cost). The editor's
                # own mood-detection debounce is only 250ms client-side, which
                # a script bypassing the UI wouldn't respect at all.
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 15
                key-resolver: "#{@userKeyResolver}"

        - id: search-service
          uri: http://search-service:8085
          predicates:
            - Path=/api/v1/search/**
          filters:
            - name: JwtAuthenticationFilter
            - name: RequestRateLimiter
              args:
                # Search-as-you-type is naturally higher-frequency than the
                # other two, so this stays the most generous of the three.
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 30
                key-resolver: "#{@userKeyResolver}"

        - id: recommendation-service
          uri: http://recommendation-service:8086
          predicates:
            - Path=/api/v1/recommendations/**
          filters:
            - name: JwtAuthenticationFilter

        - id: notification-service
          uri: http://notification-service:8087
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - name: JwtAuthenticationFilter

        - id: analytics-service
          uri: http://analytics-service:8088
          predicates:
            - Path=/api/v1/analytics/**
          filters:
            - name: JwtAuthenticationFilter

        - id: file-service
          uri: http://file-service:8089
          predicates:
            - Path=/api/v1/files/**
          filters:
            - name: JwtAuthenticationFilter

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://discovery-server:8761/eureka/}

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  # Redis is now genuinely used (the rate limiter above) and genuinely
  # reachable (spring.data.redis.host points at the real service), so the
  # default Redis health contributor now reflects real state instead of
  # needing to be force-disabled - it used to default to localhost:6379
  # (unreachable from inside the container) since nothing configured a real
  # host, which silently broke the k8s readiness/liveness probes in
  # k8s/22-gateway-service.yaml.
