server:
  port: 8080

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: ${SPRING_REDIS_PORT:6379}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
              - "http://127.0.0.1:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        # Split from the general auth-service route below so the four
        # unauthenticated, brute-forceable endpoints get a real rate limit
        # while everything else under /api/v1/auth/** (e.g. /me, /password,
        # /mfa/status) stays unthrottled. order: -1 guarantees this route is
        # matched first for these paths regardless of declaration-order
        # edge cases in Spring Cloud Gateway's route locator.
        - id: auth-service-sensitive
          uri: http://auth-service:8081
          order: -1
          predicates:
            - Path=/api/v1/auth/login,/api/v1/auth/mfa/verify,/api/v1/auth/password/forgot,/api/v1/auth/password/reset
          filters:
            - name: JwtAuthenticationFilter
            - name: RequestRateLimiter
              args:
                # A real user's occasional mistyped password/retry sails
                # through (5 immediate attempts); sustained automated
                # hammering throttles to 1/sec (60/min) after that.
                # RedisRateLimiter's token bucket only supports integer
                # per-second rates, so this is the standard shape for
                # "generous burst, tight sustained rate" on a
                # security-sensitive endpoint.
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 5
                key-resolver: "#{@ipKeyResolver}"

        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: JwtAuthenticationFilter

        - id: user-service
          uri: http://user-service:8082
          predicates:
            - Path=/api/v1/users/**
          filters:
            - name: JwtAuthenticationFilter

        - id: journal-service
          uri: http://journal-service:8083
          predicates:
            - Path=/api/v1/journals/**
          filters:
            - name: JwtAuthenticationFilter

        - id: ai-service
          uri: http://ai-service:8084
          predicates:
            - Path=/api/v1/ai/**
          filters:
            - name: JwtAuthenticationFilter

        - id: search-service
          uri: http://search-service:8085
          predicates:
            - Path=/api/v1/search/**
          filters:
            - name: JwtAuthenticationFilter

        - id: recommendation-service
          uri: http://recommendation-service:8086
          predicates:
            - Path=/api/v1/recommendations/**
          filters:
            - name: JwtAuthenticationFilter

        - id: notification-service
          uri: http://notification-service:8087
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - name: JwtAuthenticationFilter

        - id: analytics-service
          uri: http://analytics-service:8088
          predicates:
            - Path=/api/v1/analytics/**
          filters:
            - name: JwtAuthenticationFilter

        - id: file-service
          uri: http://file-service:8089
          predicates:
            - Path=/api/v1/files/**
          filters:
            - name: JwtAuthenticationFilter

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  # Redis is now genuinely used (the rate limiter above) and genuinely
  # reachable (spring.data.redis.host points at the real service), so the
  # default Redis health contributor now reflects real state instead of
  # needing to be force-disabled - it used to default to localhost:6379
  # (unreachable from inside the container) since nothing configured a real
  # host, which silently broke the k8s readiness/liveness probes in
  # k8s/22-gateway-service.yaml.
