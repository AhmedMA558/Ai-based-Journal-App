server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
              - "http://127.0.0.1:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: JwtAuthenticationFilter

        - id: user-service
          uri: http://user-service:8082
          predicates:
            - Path=/api/v1/users/**
          filters:
            - name: JwtAuthenticationFilter

        - id: journal-service
          uri: http://journal-service:8083
          predicates:
            - Path=/api/v1/journals/**
          filters:
            - name: JwtAuthenticationFilter

        - id: ai-service
          uri: http://ai-service:8084
          predicates:
            - Path=/api/v1/ai/**
          filters:
            - name: JwtAuthenticationFilter

        - id: search-service
          uri: http://search-service:8085
          predicates:
            - Path=/api/v1/search/**
          filters:
            - name: JwtAuthenticationFilter

        - id: recommendation-service
          uri: http://recommendation-service:8086
          predicates:
            - Path=/api/v1/recommendations/**
          filters:
            - name: JwtAuthenticationFilter

        - id: notification-service
          uri: http://notification-service:8087
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - name: JwtAuthenticationFilter

        - id: analytics-service
          uri: http://analytics-service:8088
          predicates:
            - Path=/api/v1/analytics/**
          filters:
            - name: JwtAuthenticationFilter

        - id: file-service
          uri: http://file-service:8089
          predicates:
            - Path=/api/v1/files/**
          filters:
            - name: JwtAuthenticationFilter

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    redis:
      # spring-boot-starter-data-redis-reactive is on the classpath (for a rate
      # limiter that was never actually wired up), so Spring Boot auto-enables a
      # Redis health contributor that defaults to localhost:6379 - unreachable
      # from inside the container, so /actuator/health always reported DOWN even
      # though nothing here depends on Redis. That silently broke the k8s
      # readiness/liveness probes in k8s/22-gateway-service.yaml (pod would never
      # become Ready). Disabled rather than pointed at a real host, since Redis
      # isn't actually used by any request path.
      enabled: false
